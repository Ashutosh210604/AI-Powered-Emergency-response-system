<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account | CareRoute</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head>
<body>
<header class="nav"><a class="brand" href="/">CareRoute</a></header>
<main class="authwrap"><form class="authcard" id="form" data-mode="signup" novalidate>
<h1>Create your account</h1><p>Choose the role that matches how you will use CareRoute.</p>
<label for="name">Full name</label><input id="name" autocomplete="name" required>
<label for="role">Role</label><select id="role"><option value="dispatcher">Ambulance dispatcher</option><option value="hospital_staff">Hospital staff</option><option value="citizen">Citizen</option></select>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required>
<p class="error" id="err" role="alert"></p>
<button class="btn primary" type="submit">Create account</button>
<p class="alt">Already registered? <a href="/login">Log in</a></p></form></main>
<script src="/auth.js"></script></body></html>
