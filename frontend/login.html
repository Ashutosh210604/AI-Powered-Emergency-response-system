<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | CareRoute</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head>
<body>
<header class="nav"><a class="brand" href="/">CareRoute</a></header>
<main class="authwrap"><form class="authcard" id="form" data-mode="login" novalidate>
<h1>Log in</h1><p>Welcome back. Enter your details to open the dashboard.</p>

<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required>
<p class="error" id="err" role="alert"></p>
<button class="btn primary" type="submit">Log in</button>
<p class="alt">New here? <a href="/signup">Create an account</a></p></form></main>
<script src="/auth.js"></script></body></html>
